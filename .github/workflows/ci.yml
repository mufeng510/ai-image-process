name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install Pillow pytest
          # GUI optional in CI unit job
          pip install "PySide6-Essentials>=6.6.0" || true
      - name: System libs for Qt offscreen (best effort)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1 libx11-6 || true
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
