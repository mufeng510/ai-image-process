name: Release

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

# Newer pushes to the same ref supersede in-flight release builds;
# tags and main get independent groups.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  package-windows:
    name: Windows portable + Inno setup (blocking)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build portable onedir + zip
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe not found after choco install innosetup"
          }
          Write-Host "ISCC_PATH=$iscc"
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Test-Path $iscc)) { throw "ISCC path invalid: $iscc" }

      - name: Build Inno installer
        shell: pwsh
        env:
          ISCC_PATH: ${{ env.ISCC_PATH }}
        run: ./scripts/build_windows_installer.ps1

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $required = @(
            "dist\AI-Image-Process-windows-x64-portable.zip",
            "dist\AI-Image-Process-windows-x64-setup.exe"
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) { throw "missing required artifact: $p" }
            Write-Host "ok $p ($((Get-Item $p).Length) bytes)"
          }
          # Live Photo headline feature: the portable zip must bundle FFmpeg.
          python -c "import zipfile; n=zipfile.ZipFile('dist/AI-Image-Process-windows-x64-portable.zip').namelist(); assert any('Tools/ffmpeg/ffmpeg.exe' in x.replace(chr(92),'/') for x in n), 'ffmpeg missing in portable zip'; print('ffmpeg bundled ok')"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dist/AI-Image-Process-windows-x64-portable.zip
            dist/AI-Image-Process-windows-x64-setup.exe
          if-no-files-found: error

  package-linux:
    name: Linux portable (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: System libs for Qt / packaging
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libx11-6 libxcb1 libxext6 zip

      - name: Build portable + archive
        run: bash scripts/build_portable.sh

      - name: Verify Linux artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/AI-Image-Process-linux-*-portable.zip)
          if [[ ${#files[@]} -lt 1 ]]; then
            echo "missing linux portable zip under dist/" >&2
            ls -la dist || true
            exit 1
          fi
          ls -lh "${files[@]}"
          # Normalize primary upload name when arch token already matches
          target="dist/AI-Image-Process-linux-x64-portable.zip"
          if [[ "${files[0]}" != "$target" ]]; then
            cp -f "${files[0]}" "$target"
          fi
          test -f "$target"
          # Live Photo headline feature: the portable zip must bundle FFmpeg.
          python3 -c "import zipfile; n=zipfile.ZipFile('$target').namelist(); assert any('Tools/ffmpeg/ffmpeg' in x for x in n), 'ffmpeg missing in portable zip'; print('ffmpeg bundled ok')"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: dist/AI-Image-Process-linux-x64-portable.zip
          if-no-files-found: error

  package-macos:
    name: macOS portable (blocking)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build portable + archive
        run: bash scripts/build_portable.sh

      - name: Verify macOS artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/AI-Image-Process-macos-*-portable.zip)
          if [[ ${#files[@]} -lt 1 ]]; then
            echo "missing macOS portable zip under dist/" >&2
            ls -la dist || true
            exit 1
          fi
          ls -lh "${files[@]}"
          primary="${files[0]}"
          echo "PRIMARY_MAC_ZIP=$(basename "$primary")" >> "$GITHUB_ENV"
          test -f "$primary"
          # Live Photo headline feature: the portable zip must bundle FFmpeg.
          python3 -c "import zipfile; n=zipfile.ZipFile('$primary').namelist(); assert any('Tools/ffmpeg/ffmpeg' in x for x in n), 'ffmpeg missing in portable zip'; print('ffmpeg bundled ok')"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/AI-Image-Process-macos-*-portable.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [package-windows, package-linux, package-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: rel
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/version.py)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            # Auto build from main: unique prerelease tag per workflow run.
            tag="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: release-assets

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release-assets

      - name: List release assets
        run: |
          set -euo pipefail
          ls -lah release-assets
          test -f release-assets/AI-Image-Process-windows-x64-portable.zip
          test -f release-assets/AI-Image-Process-windows-x64-setup.exe
          test -f release-assets/AI-Image-Process-linux-x64-portable.zip
          shopt -s nullglob
          mac=(release-assets/AI-Image-Process-macos-*-portable.zip)
          test ${#mac[@]} -ge 1

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Branch pushes: tag does not exist yet and is created at the
          # built commit. Tag pushes: tag_name already exists.
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
