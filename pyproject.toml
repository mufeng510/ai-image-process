[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-process"
version = "0.4.0"
description = "Cross-platform AI image process desktop client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "沐风" }]
dependencies = [
  "Pillow>=10.0.0",
  "packaging>=24.2",
]

[project.optional-dependencies]
# Upper bound: PySide6-Essentials 6.12.0 segfaults/SIGBUSes at interpreter
# shutdown after any test that builds MainWindow (offscreen and xcb both), so
# `pytest -q` dies with exit 135/139 after reporting "19 passed". 6.11.0 is
# clean. Remove the bound once the teardown crash is fixed upstream.
gui = ["PySide6-Essentials>=6.6.0,<6.12"]
dev = ["pytest>=8.0.0"]
provenance = ["remove-ai-watermarks>=0.26.0"]

[project.scripts]
ai-image-process = "app.main_cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
